name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flake8) and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies (dev included)
        run: uv sync --locked

      - name: Run flake8
        run: uv run flake8 src tests

      - name: Build the package
        run: uv build

  test:
    name: Tests (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          # NOTE: Django 6 requires Python 3.12+
          - { python: "3.10", django: "6.0" }
          - { python: "3.10", django: "6.1" }
          - { python: "3.11", django: "6.0" }
          - { python: "3.11", django: "6.1" }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync dependencies (dev included)
        run: uv sync --locked

      - name: Install the matrix Django version
        run: uv pip install "django~=${{ matrix.django }}.0"

      - name: Run the test suite
        run: uv run --no-sync pytest -q
