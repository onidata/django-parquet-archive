name: publish

# Publishes to PyPI on every v* tag push, with trusted publishing (OIDC): no
# token is stored in the repository. The workflow and the "pypi" environment must
# be registered as a trusted publisher in the PyPI project. Then creates the
# GitHub release of the tag, with the commits since the previous tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # NOTE: A version number can never be uploaded to PyPI twice, so a tag that does not match
      # the package version fails before anything is published
      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package version ${version}"
            exit 1
          fi

      - name: Build the package
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required by trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            git log --reverse --format='- %s' "${previous:+${previous}..}${GITHUB_REF_NAME}" | grep -v '^- Bump version to ' || true
            echo
            echo "**PyPI:** https://pypi.org/project/django-parquet-archive/${version}/"
            if [ -n "${previous}" ]; then
              echo
              echo "**Full Changelog:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md
