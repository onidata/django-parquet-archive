name: publish

# Publishes to PyPI on every published GitHub release, with trusted publishing
# (OIDC): no token is stored in the repository. The workflow and the "pypi"
# environment must be registered as a trusted publisher in the PyPI project. Then
# attaches the built distributions to the release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # NOTE: A version number can never be uploaded to PyPI twice, so a tag that does not match
      # the package version fails before anything is published
      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package version ${version}"
            exit 1
          fi

      - name: Build the package
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required by trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to upload the release assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Attach the distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*
