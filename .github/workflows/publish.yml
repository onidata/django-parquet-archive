name: publish

# Publishes to PyPI on every v* tag push, with trusted publishing (OIDC): no
# token is stored in the repository. The workflow and the "pypi" environment must
# be registered as a trusted publisher in the PyPI project.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required by trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
