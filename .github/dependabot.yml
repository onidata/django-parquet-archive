version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # NOTE: Only the lock file: the ranges in pyproject.toml are the minimum versions the library supports
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    # NOTE: The lock resolves Django 5.2 below Python 3.12 and Django 6 above it, and Dependabot collapses
    # both into Django 5.2. Update it by hand with `uv lock --upgrade-package django`
    ignore:
      - dependency-name: django
    groups:
      uv:
        patterns: ["*"]
